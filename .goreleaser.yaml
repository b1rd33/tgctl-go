version: 2

project_name: tgctl-go

before:
  hooks:
    - go mod tidy

builds:
  - id: tg
    main: ./cmd/tg
    binary: tg
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - >-
        -s -w
        -X github.com/b1rd33/tgctl-go/internal/commands.Version={{.Version}}
        -X github.com/b1rd33/tgctl-go/internal/commands.Commit={{.Commit}}
        -X github.com/b1rd33/tgctl-go/internal/commands.VersionSource=release

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

brews:
  - name: tgctl-go
    repository:
      owner: b1rd33
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/b1rd33/tgctl-go"
    description: "Go port of Python tgctl: single static `tg` binary for Telegram"
    license: MIT
    install: |
      bin.install "tg"
    test: |
      assert_match(/\Av?\d+\.\d+\.\d+/, shell_output("#{bin}/tg --version"))

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
